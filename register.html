<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="Loginstyle.css">
</head>
<body>

    <form id="registerForm">
        <h2>Register</h2>

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password">

        <label for="role">Role</label>
        <select id="role" style="width: 100%; padding: 11px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none;">
            <option value="user">Normal User</option>
            <option value="admin">Admin</option>
        </select>

        <button type="submit">Register</button>

        <p id="message" style="margin-top: 10px;"></p>
        <p style="text-align: center; font-size: 13px; margin-top: 10px;">Already have an account? <a href="login.html">Login</a></p>
    </form>

    <script src="register.js"></script>
</body>
</html>
