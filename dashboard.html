<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="Loginstyle.css">
</head>
<body>

    <div id="loginForm" style="max-width: 500px; text-align: center;">
        <h2>Welcome to your Dashboard!</h2>
        <div style="text-align: left; background: #f9f9f9; padding: 15px; border-radius: 6px; margin: 20px 0;">
            <p><strong>Name:</strong> <span id="userName"></span></p>
            <p style="margin-top: 10px;"><strong>Email:</strong> <span id="userEmail"></span></p>
            <p style="margin-top: 10px;"><strong>Role:</strong> <span id="userRole"></span></p>
        </div>
        <button id="logoutBtn" style="background-color: #ef4444;">Logout</button>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
