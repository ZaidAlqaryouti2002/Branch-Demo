<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="Loginstyle.css">
</head>
<body>

    <div id="loginForm" style="max-width: 700px;">
        <h2>Admin Dashboard</h2>
        <p style="text-align: center; margin-bottom: 20px;">Welcome, Admin! Here are all registered users:</p>
        
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px;">
            <thead>
                <tr style="background-color: #f1f1f1; border-bottom: 2px solid #ccc;">
                    <th style="padding: 10px; text-align: left;">Name</th>
                    <th style="padding: 10px; text-align: left;">Email</th>
                    <th style="padding: 10px; text-align: left;">Role</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <!-- Users will be injected here via JS -->
            </tbody>
        </table>

        <button id="logoutBtn" style="background-color: #ef4444; width: 150px; margin: 0 auto; display: block;">Logout</button>
    </div>

    <script src="admin.js"></script>
</body>
</html>
